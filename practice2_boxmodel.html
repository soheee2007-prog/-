<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>실습2 - 박스 모델</title>
<style>
  body { background: #F1F5FB; }
  .box {
    width: 260px;
    padding: 20px;               /* 안쪽 여백 */
    border: 4px dashed #FF6B57;  /* 테두리 */
    margin: 30px;                /* 바깥 여백 */
    background: #DEF3EF;
  }
  .box2 { padding: 5px; margin: 5px; }
</style>
</head>
<body>
  <div class="box">padding 20px · border 4px · margin 30px 인 박스</div>
  <div class="box box2">padding 5px · margin 5px 로 줄인 박스</div>
</body>
</html>
