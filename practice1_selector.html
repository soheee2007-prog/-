<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>실습1 - CSS 문법과 선택자</title>
<style>
  /* 태그 선택자 */
  h1 { color: #0EA5C4; font-size: 28px; }
  p  { color: #3B4A6B; line-height: 1.6; }
  /* 클래스 선택자 */
  .title { background: #EAF6F9; padding: 6px 10px; border-left: 4px solid #0EA5C4; }
  /* 아이디 선택자 */
  #header { background: #0F1B33; color: #fff; padding: 14px 18px; border-radius: 8px; }
</style>
</head>
<body>
  <div id="header">아이디 선택자 #header — 한 페이지에 1개</div>
  <h1>태그 선택자 h1 — 색상 #0EA5C4, 28px</h1>
  <p class="title">클래스 선택자 .title 이 적용된 문단</p>
  <p>태그 선택자 p 만 적용된 일반 문단입니다.</p>
  <p class="title">같은 클래스는 여러 요소에 반복해서 쓸 수 있습니다.</p>
</body>
</html>
